name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (unsigned, iPhone)
        run: |
          xcodebuild -project ToeicApp.xcodeproj -target ToeicApp \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SYMROOT="$PWD/build" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ToeicApp.app Payload/
          zip -qry ToeicApp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ToeicApp-unsigned-ipa
          path: ios/ToeicApp-unsigned.ipa
